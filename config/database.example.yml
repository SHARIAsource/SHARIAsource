default: &default
  adapter: postgresql
  pool: 5
  timeout: 5000

development:
  <<: *default
  database: replace_me_dev_db_name
  username: replace_me_db_username
  password: replace_me_db_password

test:
  <<: *default
  database: replace_me_dev_db_name
  username: replace_me_db_username
  password: replace_me_db_password

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
  # Credentials in the URL win; these cover a URL without them.
  username: <%= ENV['DATABASE_USERNAME'].to_json %>
  password: <%= ENV['DATABASE_PASSWORD'].to_json %>
